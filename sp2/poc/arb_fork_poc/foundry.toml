[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.19"
optimizer = true
optimizer_runs = 200

# Fork settings — override with ARBITRUM_RPC env var
[profile.default.rpc_endpoints]
arbitrum = "${ARBITRUM_RPC}"

[profile.default.etherscan]
arbitrum = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@eth-optimism/contracts-bedrock/=lib/optimism/packages/contracts-bedrock/",
    "src/=lib/optimism/packages/contracts-bedrock/src/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
base = "${BASE_RPC}"
